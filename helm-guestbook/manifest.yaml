apiVersion: v1
kind: Service
metadata:
  name: jsonnet-guestbook-ui
  namespace: default
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: jsonnet-guestbook-ui
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jsonnet-guestbook-ui
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: jsonnet-guestbook-ui
  template:
    metadata:
      labels:
        app: jsonnet-guestbook-ui
    spec:
      containers:
        - image: gcr.io/google-samples/gb-frontend:v5
          name: jsonnet-guestbook-ui
          ports:
            - containerPort: 80
